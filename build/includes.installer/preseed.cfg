# arunlinux — Debian Installer preseed (sane laptop defaults)
# Used by live-build's "live" debian-installer. Fully automatic EXCEPT
# partitioning (we never want to auto-wipe Arun's disk!).

d-i debian-installer/locale string en_IN.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string arunlinux
d-i netcfg/get_domain string local
d-i time/zone string Asia/Kolkata
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# User account (live-build default user is 'arun'; installer asks, we prefill)
d-i passwd/username string arun
d-i passwd/user-fullname string Arun

# Task selection — keep minimal, our packages come from the live image
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-client
d-i pkgsel/upgrade select safe-upgrade

# Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i finish-install/reboot_in_progress note
