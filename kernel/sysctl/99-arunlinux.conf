# ============================================================================
# arunlinux kernel/VM tuning for 4 GB RAM + Intel laptop
# Install to: /etc/sysctl.d/99-arunlinux.conf   then: sudo sysctl --system
# ----------------------------------------------------------------------------
# PHILOSOPHY: we use zram (compressed RAM swap) as the PRIMARY swap.
# zram is ~100x faster than disk swap, so we WANT the kernel to swap
# idle pages into it aggressively — that frees real RAM for Chrome/VS Code.
# This is the same approach Fedora & Pop!_OS use (swappiness 100/180).
# ============================================================================

# --- Swap behavior (tuned FOR zram, not disk) ---
vm.swappiness = 100
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# --- Cache pressure: don't throw away file cache too eagerly ---
vm.vfs_cache_pressure = 50

# --- Dirty page writeback: smoother on slow laptop disks ---
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500

# --- OOM: prefer killing the hog, protect the desktop a bit ---
vm.oom_kill_allocating_task = 0
vm.overcommit_memory = 1

# --- Network: slightly bigger buffers for Wi-Fi stability ---
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_fastopen = 3

# --- Laptop: file watching for VS Code (fixes "ENOSPC" watcher errors) ---
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# --- Security basics (safe desktop values; see docs/SOURCES.md for references) ---
# Hide kernel addresses and logs from unprivileged users (KASLR info-leak defense)
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# Only a parent may ptrace its own children (blocks foreign attach / cred theft)
kernel.yama.ptrace_scope = 1
# Full ASLR for userspace (stack, heap, mmap, VDSO)
kernel.randomize_va_space = 2
# Magic SysRq: allow only sync + remount-ro + reboot (0xB0 = 176)
kernel.sysrq = 176
# No unprivileged eBPF, harden the BPF JIT, no unprivileged perf profiling
kernel.unprivileged_bpf_disabled = 2
net.core.bpf_jit_harden = 2
kernel.perf_event_paranoid = 3
# Never dump setuid processes; block symlink/hardlink/fifo/regular-file races
fs.suid_dumpable = 0
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# Network: no forwarding, no redirects/source-routing, SYN cookies, spoof defense
net.ipv4.ip_forward = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
