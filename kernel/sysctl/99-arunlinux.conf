# ============================================================================
# arunlinux kernel/VM tuning for 4 GB RAM + Intel laptop
# Install to: /etc/sysctl.d/99-arunlinux.conf   then: sudo sysctl --system
# ----------------------------------------------------------------------------
# PHILOSOPHY: we use zram (compressed RAM swap) as the PRIMARY swap.
# zram is ~100x faster than disk swap, so we WANT the kernel to swap
# idle pages into it aggressively — that frees real RAM for Chrome/VS Code.
# This is the same approach Fedora & Pop!_OS use (swappiness 100/180).
# ============================================================================

# --- Swap behavior (tuned FOR zram, not disk) ---
vm.swappiness = 100
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# --- Cache pressure: don't throw away file cache too eagerly ---
vm.vfs_cache_pressure = 50

# --- Dirty page writeback: smoother on slow laptop disks ---
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500

# --- OOM: prefer killing the hog, protect the desktop a bit ---
vm.oom_kill_allocating_task = 0
vm.overcommit_memory = 1

# --- Network: slightly bigger buffers for Wi-Fi stability ---
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_fastopen = 3

# --- Laptop: file watching for VS Code (fixes "ENOSPC" watcher errors) ---
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# --- Security basics ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 2
net.ipv4.conf.all.rp_filter = 1
