# arunlinux zram config → /etc/systemd/zram-generator.conf
# Needs package: systemd-zram-generator  (fallback: zram-tools, see below)
# On a 4 GB machine this gives ~2 GB of compressed swap, roughly 4-6 GB of effective space.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
options = discard
