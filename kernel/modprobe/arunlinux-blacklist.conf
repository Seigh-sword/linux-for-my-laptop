# arunlinux: disable rare network protocols to shrink kernel attack surface.
# Desktop apps (browsers, chat, gaming, dev tools) never need these; if some
# exotic software does, delete this file and run: sudo update-initramfs -u
# ("install ... /bin/false" beats "blacklist": even explicit modprobe fails.)
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
