# ============================================================================
# Fast pre-build checks (~2 min): shell syntax, live-build flags, and every
# package name verified against the real Debian trixie repositories.
# Runs on EVERY commit (any branch) — no path filters.
# (Result + log tail are posted as a PR comment whenever a PR is open.)
# ============================================================================
name: Lint distro config

permissions:
  contents: read
  pull-requests: write

on:
  push:               # every commit on every branch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint in Debian trixie container
        id: lint
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            debian:trixie bash -c "
              set -e
              apt-get update -qq
              apt-get install -y -qq live-build debootstrap
              bash scripts/lint-distro.sh
            " 2>&1 | tee lint-output.txt
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit $RC

      - name: Report result to PR
        if: always() && steps.lint.outputs.exit_code != ''
        run: |
          PR_NUM=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "No open PR for branch ${{ github.ref_name }} — skipping PR comment."
            tail -30 lint-output.txt
            exit 0
          fi
          PASS="✅ LINT PASSED"; [ "${{ steps.lint.outputs.exit_code }}" = "0" ] || PASS="❌ LINT FAILED"
          {
            echo "## $PASS — run ${{ github.run_id }}"
            echo ""
            echo '```'
            tail -80 lint-output.txt
            echo '```'
          } > report.md
          gh pr comment "$PR_NUM" --body-file report.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint-output.txt
          retention-days: 7
