# arunlinux Intel iGPU tweaks → /etc/modprobe.d/i915-arunlinux.conf
# Enables framebuffer compression + panel self-refresh for battery + perf.
# (If you ever see flickering, set enable_psr=0 — see TROUBLESHOOTING.md)
options i915 enable_fbc=1 enable_psr=1 enable_guc=2 fastboot=1
options i915 force_probe=*
