# ============================================================================
# Build the arunlinux ISO in the cloud (GitHub Actions)
# Runs on EVERY commit (any branch) — no path filters — plus weekly schedule.
# ISO → Artifacts (kept 7 days). Result posted as PR comment when PR is open.
# Filename: arunlinux-x86_64-v<commit>.hybrid.iso
# Note: live-build needs privileges → we build inside a privileged container.
# ============================================================================
name: Build arunlinux ISO

permissions:
  contents: read
  pull-requests: write

on:
  push:               # every commit on every branch
  schedule:
    - cron: '0 2 * * 0'   # fresh ISO every Sunday at 02:00 UTC
  workflow_dispatch:

# New pushes cancel stale runs on the same branch (latest commit always wins)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift \
            /opt/az /usr/share/miniconda /opt/microsoft || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Build ISO in privileged Debian container
        id: build
        run: |
          set +e
          docker run --privileged --rm \
            -v "$PWD:/repo" -w /repo \
            debian:trixie bash -c "
              set -e
              apt-get update
              apt-get install -y live-build debootstrap cdebootstrap \
                squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools parted curl git ca-certificates
              chmod +x build/build-iso.sh build/lb-config.sh \
                build/hooks/live/* build/hooks/bootstrap/* 2>/dev/null || true
              LB_CACHE=false VERSION='${{ github.sha }}' bash build/build-iso.sh
            " 2>&1 | tee iso-build.log
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit $RC

      - name: Show result
        if: always()
        run: |
          ls -lh out/ || true
          df -h

      - name: Report result to PR
        if: always() && steps.build.outputs.exit_code != ''
        run: |
          PR_NUM=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "No open PR for branch ${{ github.ref_name }} — skipping PR comment."
            tail -20 iso-build.log
            exit 0
          fi
          PASS="[PASS] ISO BUILD PASSED"; [ "${{ steps.build.outputs.exit_code }}" = "0" ] || PASS="[FAIL] ISO BUILD FAILED"
          {
            echo "## $PASS — run ${{ github.run_id }}"
            echo ""
            echo "<details><summary>Error lines</summary>"
            echo ""
            echo '```'
            grep -iE "error|E: |failed|FAIL" iso-build.log | grep -viE "dpkg.*warning|update-alternatives|ERROR.*squashfs.*ignored" | tail -30
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Last 60 lines</summary>"
            echo ""
            echo '```'
            tail -60 iso-build.log
            echo '```'
            echo "</details>"
          } > report.md
          gh pr comment "$PR_NUM" --body-file report.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-log
          path: iso-build.log
          retention-days: 7

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: arunlinux-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 7
          if-no-files-found: error
